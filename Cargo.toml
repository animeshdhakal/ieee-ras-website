[package]
name = "ieee-ras-pulchowk"
version = "0.1.0"
edition = "2021"
description = "Static Website for IEEE Robotics & Automation Society Pulchowk STBC built with Dioxus"

[[bin]]
name = "ieee-ras-pulchowk"
path = "dioxus/src/main.rs"

[dependencies]
dioxus = { version = "0.6.3", features = ["web", "router"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
